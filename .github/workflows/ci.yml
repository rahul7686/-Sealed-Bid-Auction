name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-contract:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    # Note: Currently Midnight compiler isn't publicly available via simple script in all regions.
    # The tests in example-repo use the precompiled version or require the user to have `compact` installed.
    # We will simulate the compiler install if needed or just run tests that rely on the TS compilation.
    - name: Install dependencies
      working-directory: ./contract
      run: npm install

    - name: Run Tests
      working-directory: ./contract
      run: npm test
